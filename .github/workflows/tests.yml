name: Tests

"on":
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run unit tests
        run: python -m unittest -v
      - name: Check the example export against its contract
        run: |
          printf 'sku,name,stock\n' > "$RUNNER_TEMP/inventory-contract.csv"
          python csv_shape.py example.csv --baseline "$RUNNER_TEMP/inventory-contract.csv" --required sku --unique sku
